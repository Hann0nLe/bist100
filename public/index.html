<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIST Heatmap</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111720;--border:#293241;--text:#f4f7fb;--muted:#96a3b5;--accent:#f5c84b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto auto 1fr}.top{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--border);background:#0b0f15}.brand{display:flex;align-items:center;gap:9px;min-width:max-content}.logo{width:34px;height:34px;border:1px solid #566274;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900;background:#171e29}.title{font-weight:850;font-size:15px}.sub{font-size:9px;color:var(--muted);letter-spacing:.8px;margin-top:2px}.tools{display:flex;gap:7px;align-items:center;min-width:0;width:100%;overflow:auto}.control{height:34px;border:1px solid var(--border);border-radius:7px;background:#121923;color:var(--text);padding:0 9px}.search{min-width:190px;max-width:280px;width:100%}.badge{height:34px;display:flex;align-items:center;padding:0 10px;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:11px;white-space:nowrap}.badge.ready{color:#9be7b3;border-color:#285c3b}.summary{display:flex;gap:14px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);align-items:center;overflow:auto;white-space:nowrap}.summary b{color:var(--text)}.summary .up{color:#66d38d}.summary .down{color:#f06b75}.main{position:relative;min-height:0}.map{position:absolute;inset:0}.node{position:absolute;overflow:hidden;border:1px solid rgba(7,10,14,.72);cursor:pointer;transition:opacity .12s}.node:hover{outline:1px solid rgba(255,255,255,.8);z-index:5}.sector{pointer-events:none;background:transparent;border:1px solid rgba(255,255,255,.15)}.sector-label{position:absolute;left:5px;top:4px;right:5px;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}.ticker{font-weight:900;font-size:clamp(9px,1.1vw,16px);line-height:1}.chg{margin-top:4px;font-weight:750;font-size:clamp(8px,.9vw,13px)}.price{margin-top:3px;font-size:10px;opacity:.78}.stock-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;text-align:center}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0a0e14;z-index:20}.loading-card{text-align:center;color:var(--muted);font-size:13px}.loading-card strong{display:block;color:var(--text);margin-bottom:10px}.error{color:#f18a93;margin-top:8px;max-width:520px}.drawer{position:absolute;top:0;right:0;width:min(360px,92vw);height:100%;z-index:30;background:rgba(12,17,24,.98);border-left:1px solid var(--border);box-shadow:-18px 0 45px rgba(0,0,0,.4);padding:18px;transform:translateX(100%);transition:transform .18s ease;overflow:auto}.drawer.open{transform:none}.close{float:right;background:#1a2230;border:1px solid var(--border);color:#fff;border-radius:7px;width:32px;height:32px;cursor:pointer}.dticker{font-size:29px;font-weight:950;letter-spacing:-1px}.dname{color:var(--muted);margin:4px 0 16px}.dprice{font-size:25px;font-weight:850}.dchange{font-size:14px;font-weight:800;margin-left:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.metric{border:1px solid var(--border);border-radius:9px;padding:10px;background:#121923}.metric span{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}.metric b{font-size:13px}.ext{display:block;margin-top:18px;text-align:center;padding:10px;border:1px solid #4d586a;border-radius:8px;color:#fff;text-decoration:none;background:#18202c}.legend{display:flex;align-items:center;gap:4px;margin-left:auto}.legend i{display:block;width:22px;height:9px;border-radius:2px}@media(max-width:700px){.brand .sub{display:none}.search{min-width:130px}.badge{display:none}.summary{gap:9px}.price{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">BIST</div><div><div class="title">BIST Heatmap</div><div class="sub">GERÇEK VERİ · CLOUD PREVIEW</div></div></div>
    <div class="tools">
      <select id="sizeMetric" class="control"><option value="marketCap">Piyasa Değeri</option><option value="volume">Hacim</option></select>
      <input id="search" class="control search" placeholder="Hisse ara...">
      <div id="status" class="badge">BAĞLANIYOR</div>
      <div class="legend"><i style="background:#a71d31"></i><i style="background:#6c2027"></i><i style="background:#343b45"></i><i style="background:#1d6b3a"></i><i style="background:#0b9e4f"></i></div>
    </div>
  </header>
  <div class="summary">
    <span>Hisse <b id="count">—</b></span><span>Yükselen <b id="up" class="up">—</b></span><span>Düşen <b id="down" class="down">—</b></span><span>Ağırlıklı değişim <b id="weighted">—</b></span><span>Güncelleme <b id="updated">—</b></span>
  </div>
  <main class="main">
    <div id="map" class="map"></div>
    <div id="loading" class="loading"><div class="loading-card"><strong>Gerçek BIST verisi hazırlanıyor</strong><div id="loadText">İş Yatırım veri kaynaklarına bağlanılıyor...</div><div id="loadError" class="error"></div></div></div>
    <aside id="drawer" class="drawer"><button id="close" class="close">×</button><div id="detail"></div></aside>
  </main>
</div>
<script>
const $=id=>document.getElementById(id); const map=$('map'), loading=$('loading'), loadText=$('loadText'), loadError=$('loadError'), status=$('status'), drawer=$('drawer'), detail=$('detail');
let stocks=[], query='', sizeMetric='marketCap', resizeTimer;
const tr=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2});
const money=v=>Number.isFinite(v)?tr.format(v)+' ₺':'—';
const pct=v=>Number.isFinite(v)?`${v>=0?'+':''}${tr.format(v)}%`:'—';
const cap=v=>Number.isFinite(v)?`${tr.format(v)} Mr ₺`:'—';
const vol=v=>Number.isFinite(v)?`${tr.format(v)} Mn ₺`:'—';
function color(v){if(!Number.isFinite(v))return'#343b45';const x=Math.max(-7,Math.min(7,v));if(x<0){const t=Math.abs(x)/7;return d3.interpolateRgb('#343b45','#b3132c')(t)}const t=x/7;return d3.interpolateRgb('#343b45','#0aa34f')(t)}
function visibleStocks(){if(!query)return stocks;const q=query.toLocaleLowerCase('tr-TR');return stocks.filter(s=>s.ticker.toLocaleLowerCase('tr-TR').includes(q)||s.name.toLocaleLowerCase('tr-TR').includes(q)||s.sector.toLocaleLowerCase('tr-TR').includes(q))}
function render(){const rows=visibleStocks();map.replaceChildren();if(!rows.length)return;const w=Math.max(map.clientWidth,320),h=Math.max(map.clientHeight,280);const grouped=d3.group(rows,d=>d.sector||'Diğer');const data={name:'BIST',children:[...grouped].map(([name,ss])=>({name,children:ss}))};const root=d3.hierarchy(data).sum(d=>d.ticker?Math.max(Number(d[sizeMetric])||0,.001):0).sort((a,b)=>b.value-a.value);d3.treemap().size([w,h]).paddingOuter(2).paddingInner(1).paddingTop(d=>d.depth===1?20:0).round(true)(root);
for(const n of root.descendants().filter(d=>d.depth===1)){const e=document.createElement('div');e.className='node sector';Object.assign(e.style,{left:n.x0+'px',top:n.y0+'px',width:(n.x1-n.x0)+'px',height:(n.y1-n.y0)+'px'});const l=document.createElement('div');l.className='sector-label';l.textContent=`${n.data.name} · ${n.leaves().length}`;e.append(l);map.append(e)}
for(const n of root.leaves()){const s=n.data,e=document.createElement('article'),ww=n.x1-n.x0,hh=n.y1-n.y0;e.className='node';e.style.background=color(s.d1);Object.assign(e.style,{left:n.x0+'px',top:n.y0+'px',width:ww+'px',height:hh+'px'});const showPrice=ww>70&&hh>48;e.innerHTML=`<div class="stock-content"><div class="ticker">${s.ticker}</div><div class="chg">${pct(s.d1)}</div>${showPrice?`<div class="price">${money(s.price)}</div>`:''}</div>`;e.title=`${s.ticker} · ${s.name}\n${s.sector}\n${pct(s.d1)}`;e.onclick=()=>openDetail(s);map.append(e)}}
function openDetail(s){detail.innerHTML=`<div class="dticker">${s.ticker}</div><div class="dname">${s.name}</div><div><span class="dprice">${money(s.price)}</span><span class="dchange" style="color:${Number.isFinite(s.d1)&&s.d1<0?'#f06b75':'#66d38d'}">${pct(s.d1)}</span></div><div class="grid"><div class="metric"><span>Piyasa Değeri</span><b>${cap(s.marketCap)}</b></div><div class="metric"><span>Hacim</span><b>${vol(s.volume)}</b></div><div class="metric"><span>Sektör</span><b>${s.sector}</b></div><div class="metric"><span>F/K</span><b>${Number.isFinite(s.pe)?tr.format(s.pe):'—'}</b></div><div class="metric"><span>Halka Açıklık</span><b>${Number.isFinite(s.freeFloatPercent)?tr.format(s.freeFloatPercent)+'%':'—'}</b></div><div class="metric"><span>Hacim (Lot)</span><b>${Number.isFinite(s.volumeShares)?tr.format(s.volumeShares):'—'}</b></div></div><a class="ext" target="_blank" rel="noopener" href="https://tr.investing.com/search/?q=${encodeURIComponent(s.ticker)}">Investing.com'da aç ↗</a>`;drawer.classList.add('open')}
$('close').onclick=()=>drawer.classList.remove('open');
$('search').oninput=e=>{query=e.target.value;render()};$('sizeMetric').onchange=e=>{sizeMetric=e.target.value;render()};
function updateSummary(payload){const ss=payload.stocks||[];const finite=ss.filter(s=>Number.isFinite(s.d1));const up=finite.filter(s=>s.d1>0).length,down=finite.filter(s=>s.d1<0).length;let n=0,d=0;for(const s of finite)if(s.marketCap>0){n+=s.d1*s.marketCap;d+=s.marketCap}$('count').textContent=ss.length;$('up').textContent=up;$('down').textContent=down;$('weighted').textContent=pct(d?n/d:null);$('updated').textContent=payload.generatedAt?new Date(payload.generatedAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—'}
async function load(){try{const r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||`Sunucu hazırlanıyor (${r.status})`)}const p=await r.json();stocks=p.stocks||[];if(!stocks.length)throw new Error('Hisse verisi henüz hazır değil');loading.style.display='none';status.textContent='GERÇEK VERİ';status.classList.add('ready');updateSummary(p);render()}catch(e){loadText.textContent='Veri katmanı henüz hazır değil.';loadError.textContent=e.message;setTimeout(load,4000)}}
new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,70)}).observe(map);load();setInterval(async()=>{if(loading.style.display!=='none')return;try{const r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok)return;const p=await r.json();stocks=p.stocks||stocks;updateSummary(p);render()}catch{}},60000);
</script>
</body>
</html>
